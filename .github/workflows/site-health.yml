name: Monthly Site Health Check

on:
  schedule:
    - cron: '0 6 1 * *' # 1st of each month, 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/site-health.yml'
      - 'public/**/*.json'
      - 'src/components/*.tsx'
      - 'index.html'
      - 'scripts/check-staleness.js'
      - 'scripts/fetch-publications.js'

permissions:
  contents: read

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check data files are not stale
        run: node scripts/check-staleness.js

  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check for dead links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir public
            --accept 200,202,204,206,301,302,307,308,403,429
            --exclude 'localhost'
            --exclude 'formspree.io'
            --exclude 'linkedin\.com'
            'public/**/*.json'
            'src/components/*.tsx'
            'index.html'
          fail: true
      - name: File an issue when links are dead
        # Only lychee's link-failure exit code should create a maintenance issue.
        if: >-
          failure() &&
          steps.lychee.outputs.exit_code == '2' &&
          github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'lychee/out.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'No link report was produced; inspect the workflow logs.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dead links found by monthly check (${new Date().toISOString().slice(0, 10)})`,
              body: 'The monthly lychee run found broken links. See the workflow logs: ' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                '\n\n' + report,
            });

  publisher-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify publisher endpoint variants
        run: |
          python - <<'PY'
          import concurrent.futures, subprocess, tempfile
          urls = [
              'http://www.paralia.fr/jngcgc/17_20_traboulsi.pdf',
              'https://www.paralia.fr/jngcgc/17_20_traboulsi.pdf',
              'http://paralia.fr/jngcgc/17_20_traboulsi.pdf',
              'https://paralia.fr/jngcgc/17_20_traboulsi.pdf',
              'https://www.researchgate.net/publication/367449776_Impact_of_climate_change_on_the_hydrodynamic_patterns_of_the_Gironde_estuary',
          ]
          def probe(url):
              with tempfile.NamedTemporaryFile() as output:
                  result = subprocess.run(['curl', '-sS', '-L', '--connect-timeout', '5', '--max-time', '20', '--range', '0-1023', '-o', output.name, '-w', '%{http_code} %{url_effective}', url], capture_output=True, text=True)
                  body = output.read(32)
                  return (url, result.returncode, result.stdout, result.stderr, repr(body))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for result in pool.map(probe, urls):
                  print(result)
          PY
