name: Update Publications from OpenAlex

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger
  push:
    paths:
      - 'scripts/fetch-publications.js'
      - '.github/workflows/update-publications.yml'

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create data directory
        run: mkdir -p public/data
      
      - name: Fetch publications from OpenAlex
        run: node scripts/fetch-publications.js
        env:
          OPENALEX_AUTHOR_ID: A5082088726
          OPENALEX_ACCESS_TOKEN: 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
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/publications.json
          git commit -m "📚 Update publications from OpenAlex API
          
          Automated weekly update of publication data.
          
          🤖 Generated by GitHub Actions"
          git push