name: Update Career Data from LinkedIn

# Manual-only until a LinkedIn data source is configured (see
# public/data/README.md). Re-add a schedule trigger once one of
# LINKEDIN_PROFILE_API_URL / LINKEDIN_SOURCE_JSON / a local export
# workflow is actually in use.
on:
  workflow_dispatch:

jobs:
  update-linkedin:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LinkedIn career data
        run: node scripts/fetch-linkedin-profile.js
        env:
          LINKEDIN_PROFILE_URL: https://www.linkedin.com/in/mtraboulsi/
          LINKEDIN_PROFILE_API_URL: ${{ secrets.LINKEDIN_PROFILE_API_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_SOURCE_JSON: ${{ secrets.LINKEDIN_SOURCE_JSON }}

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain public/data/experience.json public/data/linkedin-feed.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/experience.json public/data/linkedin-feed.json
          git commit -m "Update career data from LinkedIn"
          git push
