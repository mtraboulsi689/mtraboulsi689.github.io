<!--
  Source for public/og-image.png (1200x630 link-preview card), matching the
  site's warm-paper/navy/teal design: flat navy with a teal radial glow,
  Space Grotesk display + IBM Plex Sans body, gold badge.

  Regenerate after a design or positioning change: open this file in a
  browser at exactly 1200x630 (or screenshot the .card element with a
  headless browser) and save over public/og-image.png. Font paths resolve
  relative to the repo root via node_modules, so open it from a checkout
  with dependencies installed.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG image source</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2');
    font-weight: 300 700;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('../node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 700;
  }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(circle at 88% -12%, rgba(45, 106, 126, 0.55) 0%, transparent 46%),
      #091725;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    padding: 64px 80px 58px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #d9af75;
    border: 1.5px solid rgba(62, 160, 165, 0.5);
    border-radius: 999px;
    padding: 10px 22px;
  }
  h1 {
    position: relative;
    font-size: 92px;
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.03em;
    margin-top: 24px;
  }
  h1 .phd { color: #3ea0a5; }
  .positioning {
    position: relative;
    margin-top: 24px;
    max-width: 720px;
    font-size: 27px;
    font-weight: 400;
    line-height: 1.4;
    color: #c7cfd7;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .strip {
    position: relative;
    display: flex;
    gap: 44px;
    padding-top: 26px;
    border-top: 1px solid rgba(255, 255, 255, 0.16);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: rgba(199, 207, 215, 0.75);
  }
  .strip .site { margin-left: auto; color: #d9af75; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="badge">Consulting engineer — coastal &amp; shoreline modelling</div>
      <h1>Mohammad Traboulsi<span class="phd">.PhD</span></h1>
      <div class="positioning">
        I help engineering firms and coastal territories quantify shoreline
        retreat under sea-level rise.
      </div>
    </div>

    <div class="strip">
      <span>LX-ST model</span>
      <span>BRGM</span>
      <span>Horizon 2100</span>
      <span class="site">mtraboulsi689.github.io</span>
    </div>
  </div>
</body>
</html>
