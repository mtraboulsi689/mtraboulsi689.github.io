<!--
  Source for public/og-image.png (1200x630 link-preview card), matching the
  site's technical-editorial design: abyss gradient, bathymetric contours
  (same generator as src/components/ContourLines.tsx), Space Grotesk +
  JetBrains Mono.

  Regenerate after a design or positioning change: open this file in a
  browser at exactly 1200x630 (or screenshot the .card element with a
  headless browser) and save over public/og-image.png. Font paths resolve
  relative to the repo root via node_modules, so open it from a checkout
  with dependencies installed.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG image source</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2');
    font-weight: 300 700;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
  }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: linear-gradient(150deg, hsl(214, 95%, 12%) 0%, hsl(212, 85%, 18%) 55%, hsl(200, 70%, 24%) 100%);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    padding: 70px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .contours {
    position: absolute;
    right: -14%;
    top: 0;
    height: 100%;
    width: 62%;
    color: #fff;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.55);
  }
  h1 {
    position: relative;
    font-size: 88px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.02em;
    margin-top: 18px;
  }
  h1 .dot { color: #e2552e; }
  h1 .phd {
    font-size: 34px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.5);
    margin-left: 14px;
  }
  .positioning {
    position: relative;
    margin-top: 26px;
    max-width: 700px;
    font-size: 27px;
    font-weight: 400;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.85);
    font-family: 'Space Grotesk', sans-serif;
  }
  .strip {
    position: relative;
    display: flex;
    gap: 42px;
    padding-top: 26px;
    border-top: 1px solid rgba(255, 255, 255, 0.18);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="contours" id="contours" viewBox="0 0 1100 600" fill="none" preserveAspectRatio="xMidYMid slice"></svg>

    <div>
      <div class="eyebrow">Consulting engineer — coastal &amp; shoreline modelling</div>
      <h1>Mohammad Traboulsi<span class="dot">.</span><span class="phd">PhD</span></h1>
      <div class="positioning">
        I help engineering firms and coastal territories quantify shoreline
        retreat under sea-level rise.
      </div>
    </div>

    <div class="strip">
      <span>LX-ST model</span>
      <span>BRGM</span>
      <span>Horizon 2100</span>
      <span>mtraboulsi689.github.io</span>
    </div>
  </div>

  <script>
    // Same ring generator as src/components/ContourLines.tsx.
    const ringPath = (cx, cy, radius, seed) => {
      const steps = 24;
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const wobble =
          Math.sin(a * 2 + seed) * 0.1 +
          Math.sin(a * 3 + seed * 2.7) * 0.06 +
          Math.sin(a * 5 + seed * 1.3) * 0.035;
        const r = radius * (1 + wobble);
        pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.78 });
      }
      let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < steps; i++) {
        const p0 = pts[(i - 1 + steps) % steps];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % steps];
        const p3 = pts[(i + 2) % steps];
        const c1x = p1.x + (p2.x - p0.x) / 6;
        const c1y = p1.y + (p2.y - p0.y) / 6;
        const c2x = p2.x - (p3.x - p1.x) / 6;
        const c2y = p2.y - (p3.y - p1.y) / 6;
        d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      return `${d} Z`;
    };

    const svg = document.getElementById('contours');
    for (let i = 0; i < 9; i++) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', ringPath(560, 300, 70 + i * 62, i * 1.7 + 0.9));
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', i === 0 ? '1.5' : '1');
      path.setAttribute('opacity', String(0.32 - i * 0.028));
      svg.appendChild(path);
    }
  </script>
</body>
</html>
